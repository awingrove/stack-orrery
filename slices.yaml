# slices.yaml — static-JS flavor (grammar + meta-rules: factory-kit SLICES.md,
# https://github.com/awingrove/factory-kit/blob/main/SLICES.md)
# Role vocabulary: pages, js, css, unit_tests, e2e_specs.
# Declare every role on every slice, [] included.
slices:
  - id: SHELL
    name: Application Shell
    roles:
      pages:
        - index.html
      js: []
      css:
        - css/shell/**
      unit_tests: []
      e2e_specs:
        - e2e/shell.spec.js
    owns: []
    calls: []
    tests:
      - e2e: shell::should reach the diagram panel from the landing page
    entry_point: index.html (app root)

  - id: SIM
    name: Simulator Core
    roles:
      pages: []
      js:
        - js/sim/**
      css: []
      unit_tests:
        - test/sim/**
      e2e_specs: []
    owns: []
    calls: []
    tests:
      - unit: test/sim/engine.test.js::same seed replays the identical tick sequence
      - unit: test/sim/webserver.test.js::queue depth climbs when arrival rate exceeds service rate
      - unit: test/sim/network.test.js::browser sends slim GET over network mini-IP and parses 200 and 404 responses
      - unit: test/sim/webserver.test.js::handleRequest routes slim GET paths to 200 or 404 and rejects non-GET with 405
      - unit: test/sim/loadbalancer.test.js::distributes requests strictly round-robin across backend mini-IPs
      - unit: test/sim/loadbalancer.test.js::stage 2 engine splits load across 10.11 and 10.12 and doubles service capacity
      - unit: test/sim/loadbalancer-failover.test.js::selectBackend skips a down backend — the cursor lands on the healthy backend, skips tally, rotation resumes
      - unit: test/sim/loadbalancer-failover.test.js::the down address is never sent to or delivered to while the pool skips it
      - unit: test/sim/loadbalancer-failover.test.js::all backends down hands back the slice-1 refusal record and refusals tally with nothing enqueued
      - unit: test/sim/loadbalancer-failover.test.js::an all-down pool aborts the stage-2 trace at the LB hop with the refusal record
      - unit: test/sim/loadbalancer-failover.test.js::stage-2 engine snapshot carries skippedCount
      - unit: test/sim/loadbalancer-failover.test.js::distribution lopsides while 10.12 is down and rejoins the rotation after restore (deterministic)
      - unit: test/sim/loadbalancer-failover.test.js::same seed replays the identical tick sequence with the fault off (stage 2)
      - unit: test/sim/cache.test.js::serves cache hits before TTL expiry and evicts entries once ttlTicks elapse
      - unit: test/sim/cache.test.js::stage 3 engine shares cache-aside entries across 10.11 and 10.12
      - unit: test/sim/cache-bypass.test.js::setBypass validates a boolean ON/OFF flag and isBypass reads it back (fail loud)
      - unit: test/sim/cache-bypass.test.js::a bypassed lookup leaves the entries and the counters untouched — get hands back null with a BYPASSED record and has peers nothing
      - unit: test/sim/cache-bypass.test.js::engine setCacheBypassed is fail-loud below stage 3 — no cache exists there
      - unit: test/sim/cache-bypass.test.js::a bypassed stage-3 GET takes the origin path — cacheStatus BYPASSED, the cache fills nothing, bypassedCount tallies
      - unit: test/sim/cache-bypass.test.js::rejoin cold is deterministic — entries expiring while bypassed produce fresh MISSes that refill
      - unit: test/sim/cache-bypass.test.js::DL-3 counter-example — the bypassed story stays a full sourced 200; the non-GET frame keeps its own BYPASS token
      - unit: test/sim/cache-bypass.test.js::same seed replays the identical tick sequence with the fault off (stage 3)
      - unit: test/sim/database.test.js::replicates primary writes to the read replica after replicationLagTicks and tracks stale reads
      - unit: test/sim/database.test.js::stage 4 engine writes to Primary 10.30, invalidates Cache 10.20, serves stale replica reads during lag, and catches up
      - unit: test/sim/primary-down.test.js::setPrimaryDown validates a boolean ON/OFF flag and isPrimaryDown reads it back (fail loud)
      - unit: test/sim/primary-down.test.js::a downed write leaves the store untouched — reads and in-flight replication stay green
      - unit: test/sim/primary-down.test.js::engine setDatabasePrimaryDown is fail-loud below stage 4 — no database exists there
      - unit: test/sim/primary-down.test.js::a primary-down POST answers a real 503 — the cache keeps serving the pre-fault body and the primary version holds
      - unit: test/sim/primary-down.test.js::failedWrites tallies pool-summed across the server pool
      - unit: test/sim/primary-down.test.js::restore puts writes back — the next write is a real 200 WRITE with the version continuing from history
      - unit: 'test/sim/primary-down.test.js::DL-3 counter-example — the failed write keeps the full served-story arc: a real 503 rides the normal hops, no refusal'
      - unit: test/sim/primary-down.test.js::DL-3 counter-example — same-fault GET frames stay byte-identical to the off-fault SELECT story
      - unit: test/sim/primary-down.test.js::DL-3 counter-example — the async /jobs story stays a byte-identical 202 with the primary down (stage 5)
      - unit: test/sim/primary-down.test.js::same seed replays the identical tick sequence with the fault off (stage 4)
      - unit: test/sim/queue.test.js::worker queue sim component
      - unit: test/sim/worker-crash.test.js::setCrashed validates a boolean ON/OFF flag and isCrashed reads it back (fail loud)
      - unit: test/sim/worker-crash.test.js::a crashed step drains nothing — the backlog grows and no commit is attempted
      - unit: 'test/sim/worker-crash.test.js::the crash flip re-queues an ACTIVE job to the head — byte-identical queued shape, redelivered bumps'
      - unit: test/sim/worker-crash.test.js::a crash flip with no active job moves nothing — redelivered stays flat, the queue byte-holds
      - unit: test/sim/worker-crash.test.js::restore re-delivers the re-queued job — it re-times from scratch and commits exactly once
      - unit: test/sim/worker-crash.test.js::engine setWorkerCrashed is fail-loud below stage 5 — no worker queue exists there
      - unit: test/sim/worker-crash.test.js::engine setWorkerCrashed routes to the queue at stage 5 — the snapshot reads it back and re-delivery commits
      - unit: 'test/sim/worker-crash.test.js::DL-3 counter-example — a crashed worker tail narrates the crash, never a fake commit, and the 202 enqueue frames stay byte-identical'
      - unit: 'test/sim/worker-crash.test.js::DL-3 counter-example — synchronous POST write-through and GET frames stay byte-identical with the worker crashed'
      - unit: test/sim/worker-crash.test.js::same seed replays the identical tick sequence with the fault off (stage 5)
      - unit: test/sim/dns.test.js::answers the authoritative table on a miss, the ledger inside ttlTicks, and evicts on expiry
      - unit: test/sim/dns.test.js::stage 6 engine exposes DNS 10.60 and resolves example.com through the trace
      - unit: test/sim/dns-ledger-drop.test.js::setDropped validates a boolean ON/OFF flag and isDropped reads it back (fail loud)
      - unit: test/sim/dns-ledger-drop.test.js::the true flip purges example.com and cd.example.com from BOTH tables
      - unit: test/sim/dns-ledger-drop.test.js::a dropped lookup rides the NX branch — droppedLookups grows for the dropped name only
      - unit: test/sim/dns-ledger-drop.test.js::cd.example.com lookups stay OK while dropped and pay the re-resolve era nothing (order pin)
      - unit: 'test/sim/dns-ledger-drop.test.js::the restored flip re-adds the record — next lookup AUTH, reResolveAfterDrop counts exactly once'
      - unit: test/sim/dns-ledger-drop.test.js::engine setDnsDropped is fail-loud below stage 6 — no DNS exists there
      - unit: 'test/sim/dns-ledger-drop.test.js::engine setDnsDropped routes to the DNS at stage 6 — the snapshot reads the flag and counters back'
      - unit: 'test/sim/dns-ledger-drop.test.js::DL counter-example — the NX-drop run narrates exactly like an unknown-host NX run, no new frame'
      - unit: 'test/sim/dns-ledger-drop.test.js::DL counter-example — host-less /about stays byte-identical while the record is dropped'
      - unit: 'test/sim/dns-ledger-drop.test.js::DL counter-example — cd.example.com hosted runs stay byte-identical with the record dropped'
      - unit: 'test/sim/dns-ledger-drop.test.js::DL counter-example — a restored run narrates a fresh AUTH answer then the 200, no NX residue'
      - unit: test/sim/dns-ledger-drop.test.js::same seed replays the identical tick sequence with the fault off (stage 6)
      - unit: test/sim/router.test.js::rejects invalid mini-IPs and missing networks at construction
      - unit: test/sim/router.test.js::passes same-subnet frames through untouched and takes exactly one hop across subnets
      - unit: test/sim/router.test.js::re-seats to 20.254 by default and crosses a subnet-20 frame leftward
      - unit: test/sim/router.test.js::stage 6 engine exposes the router; stages 1-5 do not
      - unit: test/sim/cdn.test.js::rejects invalid mini-IPs and a non-positive-integer TTL at construction
      - unit: test/sim/cdn.test.js::answers a HIT from the ledger inside ttlTicks and a MISS when absent
      - unit: test/sim/cdn.test.js::evicts an expired entry and never answers from the ledger past expiry
      - unit: test/sim/cdn.test.js::rejects an empty or non-string fill path/body (fail-loud)
      - unit: test/sim/cdn.test.js::keeps a pass-through edge untouched — no lookup, no counters, no row
      - unit: test/sim/webserver-fault.test.js::setDown validates a boolean off/on flag and isDown reads it back (fail loud)
      - unit: test/sim/webserver-fault.test.js::network send and deliverToQueue both refuse a registered-but-down host with the refusal-record shape
      - unit: test/sim/webserver-fault.test.js::refused deliveries never enqueue — the down host queue depth stays flat and refusals tally
      - unit: test/sim/webserver-fault.test.js::the engine counts refusals (refusedCount) and never enqueues crowd sends while down
      - unit: test/sim/webserver-fault.test.js::DL-3 counter-example — lastStatus stays null across a refusal, no mission detector can be satisfied
      - unit: test/sim/webserver-fault.test.js::same seed replays the identical tick sequence with the fault off
      - unit: test/sim/engine.test.js::rejects a stage outside 1..6
      - unit: test/sim/engine.test.js::traces example.com/about through the DNS ask/answer prelude into the stage-5 chain
      - unit: test/sim/engine.test.js::keeps a host-less /about trace at the stage-5 hop story on stage 6
      - unit: test/sim/engine.test.js::ends an NX trace at the DNS answer hop without ever emitting a GET
      - unit: 'test/sim/engine.test.js::exposes snapshot.cdn on stage 6 and cdn: null on stages 1-5'
      - unit: test/sim/engine.test.js::pulls cd.example.com through the Router on an edge MISS and fills the ledger (9 hops)
      - unit: test/sim/engine.test.js::serves a second cd.example.com trace from the ledger in 6 hops (edge HIT)
      - unit: test/sim/engine.test.js::keeps an origin write stale at the edge inside the TTL and pulls the new bytes after expiry
      - unit: test/sim/engine.test.js::passes a POST through to the origin without touching the edge ledger
      - unit: test/sim/cdn.test.js::answers a HIT from the ledger inside ttlTicks and a MISS when absent
      - unit: test/sim/cdn.test.js::evicts an expired entry and never answers from the ledger past expiry
      - unit: test/sim/cdn.test.js::keeps a pass-through edge untouched — no lookup, no counters, no row
      - unit: test/sim/webserver.test.js::throws on a non-mini-IP address at construction (fail-loud, cache/dns precedent)
      - unit: test/sim/webserver.test.js::keeps the serviceRate error message byte-unchanged on a zero rate (fail-loud)
      - unit: "test/sim/engine.test.js::DL-3 counter-example — an all-down stage-6 pool aborts the trace at the LB hop with the stage-2 machine's refusal card: neither [object Object] nor a phantom chain"
      - unit: "test/sim/engine.test.js::the stage-6 all-down refusal frame is byte-identical to the stage-2 machine's for the same request"
      - unit: test/sim/engine.test.js::a one-down stage-6 pool narrates the crossed seat in the LB frame
      - unit: test/sim/engine.test.js::the stage-6 trace record exposes the same refused vocabulary as stages 1-5
    entry_point: n/a (engine logic; rendered by PANEL-1)

  - id: PANEL
    name: Diagram Panel — Single Web Server
    roles:
      pages:
        - panel.html
      js:
        - js/panel/**
      css:
        - css/panel/**
      unit_tests:
        - test/panel/**
      e2e_specs:
        - e2e/panel.spec.js
        - e2e/webserver-fs.spec.js
        - e2e/fs-editor.spec.js
        - e2e/panel-stage6.spec.js
        - e2e/cdn-edge.spec.js
        - e2e/orrery-plane.spec.js
        - e2e/camera-drawer.spec.js
        - e2e/teaching.spec.js
        - e2e/missions.spec.js
        - e2e/compare.spec.js
        - e2e/control-room-rail.spec.js
        - e2e/fault-console.spec.js
        - e2e/fault-console-helpers.js
        - e2e/fault-console-stage4.spec.js
        - e2e/fault-console-stage5.spec.js
    owns:
      - panel.html
    calls:
      - SHELL
      - SIM
    tests:
      - unit: test/panel/model.test.js::snapshot exposes queue depth and latency as UI state
      - unit: test/panel/model.test.js::snapshot exposes throughput per tick alongside served total
      - unit: test/panel/model.test.js::tick 0 renders 0.00/t without NaN
      - unit: test/panel/camera.test.js::refits when the world grows past the viewport and auto-refit cancels on manual zoom
      - unit: test/panel/model.test.js::formats the latest HTTP exchange across mini-IPs for the inspector
      - unit: test/panel/model.test.js::describes hop-by-hop trace labels and component inspector state
      - unit: test/panel/model.test.js::maps a live snapshot to the webserver inspector state as JSON
      - unit: test/panel/model.test.js::describes Stage 2 5-hop load-balancer trace labels and loadbalancer inspector state
      - unit: test/panel/camera.test.js::pans world coordinates inversely to zoom and clamps to world bounds
      - unit: test/panel/camera.test.js::zooms toward the cursor while keeping the cursor world point fixed
      - unit: test/panel/camera.test.js::computes concentric ring coordinates and stage bounding boxes for the orrery
      - unit: test/panel/camera.test.js::maps every simulated browser to an addressable Ring 3 slot around the expanded one
      - unit: test/panel/model-stage34.test.js::describes Stage 3 6-hop cache-aside trace labels and cache inspector state
      - unit: test/panel/model-stage34.test.js::describes Stage 4 7-hop database trace labels and database inspector state
      - unit: test/panel/model-stage5.test.js::describes Stage 5 8-hop async queue trace labels and workerqueue inspector state
      - unit: test/panel/model.test.js::stage 1 webserver headline derives mini-IP 10.1 from the live snapshot, not from the static 10.11 / 10.12 entry
      - unit: test/panel/model.test.js::stages 2-5 webserver headline derives the snapshot backends as mini-IP 10.11 / 10.12
      - unit: test/panel/model.test.js::journey entries order by run key then ascending hop, keeping labels whole
      - unit: test/panel/render.test.js::within one run, hop entries order ascending regardless of emission order
      - unit: test/panel/render.test.js::a newer run floats above an older one; entries stay whole per run
      - unit: test/panel/model-compare.test.js::unequal runs align over the longer side and pad the exhausted side with em-dashes
      - unit: test/panel/model-compare.test.js::equal runs align hop-for-hop with no em-dash padding
      - unit: test/panel/model-compare.test.js::alignment passes entry texts through byte-verbatim without mutating the entries
      - unit: test/panel/model-compare.test.js::first push fills A then B, a third distinct run shifts A <- old B, B <- new
      - unit: test/panel/model-compare.test.js::a repeat push of an already-stored run is a no-op, not a duplicate or a shift
      - unit: test/panel/model-compare.test.js::a tick-shaped run (hops 0, no hop entries) is rejected — crowd ticks never enter the tray
      - unit: "test/panel/model-compare.test.js::alignment is driven by the entries' hop keys, not their array order"
      - e2e: compare::should compare the last two trace runs hop-by-hop in the compare tray
      - e2e: compare::should show em-dash rows where one run is shorter (9 vs 6)
      - e2e: compare::should never compare crowd-tick runs into the tray
      - e2e: compare::should clear the compare tray on a stage switch
      - e2e: panel::should show queue depth climbing as simulated users increase
      - e2e: panel::should step a single tick and display the slim HTTP exchange over mini-IP 10.1
      - e2e: panel::should trace a custom URL hop-by-hop into the browser viewport and inspect component code
      - e2e: panel::should switch to Stage 2, alternate requests across 10.11 and 10.12 via the load balancer, and inspect its code
      - e2e: panel::should switch to Stage 3, warm Cache 10.20 on a miss from 10.11, serve a hit from 10.12, and inspect cache code
      - e2e: panel::should switch to Stage 4, write to Primary 10.30 on POST, observe replica lag on GET, and inspect database code
      - e2e: panel::should switch to Stage 5, process an async POST /jobs job through worker 10.41, and inspect queue state
      - unit: test/panel/teaching.test.js::describes all shipped stages with a headline, three lists, a tradeoff, and a primerLink
      - unit: test/panel/teaching.test.js::stage 1 content never mentions cache TTL names
      - unit: test/panel/teaching.test.js::unknown stages degrade to a pending-entries placeholder, not a crash
      - unit: 'test/panel/missions.test.js::stages 1 and 3-6 carry four; stage 2 carries two to three (B-6 recovery + B-6b failover + B-6c bypass-cold + B-6d write-fail + B-6e worker-crash + B-6f dns-drop)'
      - unit: test/panel/missions.test.js::the stage-1 404 mission completes only on a real 404 — a 405 does not
      - unit: test/panel/missions.test.js::the stage-1 recovery mission completes only after a refusal AND a served 200 — a refusal alone satisfies neither leg
      - unit: test/panel/missions.test.js::the stage-2 failover mission completes only after a skip AND 10.12 serves again — either leg alone stays pending
      - unit: test/panel/missions.test.js::the stage-3 bypass-cold mission completes only after bypass AND a fresh HIT — either leg alone stays pending
      - unit: test/panel/missions.test.js::the stage-4 write-fail mission completes only after a failed write AND a restored WRITE — either leg alone stays pending
      - unit: test/panel/missions.test.js::the stage-5 re-delivery mission completes only after a redelivery AND a re-delivered commit — either leg alone stays pending
      - unit: test/panel/missions.test.js::the stage-6 edge-HIT mission completes only on trace edgeStatus HIT — an origin cache HIT does not
      - unit: 'test/panel/missions.test.js::the stage-6 NX mission completes only after a dropped lookup AND a restored resolve — either leg alone stays pending'
      - unit: 'test/panel/missions.test.js::verification latches: a done mission does not un-verify while the clock runs'
      - unit: test/panel/missions.test.js::a fresh verified set flips missions back to pending and the completing tick is forgotten
      - unit: test/panel/missions.test.js::pending progress text reads the snapshot field the detector reads
      - unit: test/panel/missions.test.js::an unknown stage returns an empty list without throwing
      - e2e: 'missions::should verify a mission automatically from real sim state (stage 1: 404)'
      - e2e: missions::should not complete the 404 mission on a 405
      - e2e: missions::should complete the edge-HIT mission only on a trace edge HIT, not an origin cache HIT
      - e2e: missions::should prefill the mini-browser from a mission that carries a URL (no auto-send)
      - e2e: missions::should clear verified missions on a stage switch
      - unit: test/panel/model-stage6.test.js::describes the hosted 9-hop trace with the DNS ask/answer prelude and ledger labels
      - unit: test/panel/model-stage6.test.js::keeps a host-less /about trace at the byte-identical stage-5 sentences
      - unit: test/panel/model-stage6.test.js::ends the NX narrative at the answer hop with no GET emitted
      - unit: test/panel/layout-stage6.test.js::inherits the stage-5 ring stack and seats the DNS and Router nodes on new spokes
      - unit: test/panel/layout-stage6.test.js::buildStage6Extras derives the router/browser-reach bound and lane wires from real geometry
      - unit: test/panel/model-stage6.test.js::narrates the 9-hop MISS shape through the Router with the ledger fill
      - unit: test/panel/model-stage6.test.js::narrates the 6-hop HIT shape from the ledger with no origin traffic
      - unit: test/panel/model-stage6.test.js::narrates a POST pass-through with no ledger write
      - unit: test/panel/model-stage6.test.js::exposes the cdn inspector state and headline from the snapshot
      - e2e: cdn-edge::should resolve cd.example.com and serve an edge HIT through the Router (6 hops)
      - e2e: cdn-edge::should pull the origin through the Router on an edge MISS and fill the ledger (9 hops)
      - e2e: cdn-edge::should keep an origin edit stale at the edge until the TTL expires
      - e2e: cdn-edge::should pass a POST through to the origin without filling the edge
      - e2e: teaching::should open the teaching drawer, trace it across stage switches, and show stage-1 content only on stage 1
      - e2e: teaching::should link to the system-design-primer section for the active stage
      - e2e: orrery-plane::should pan and zoom the concentric orrery plane and reset with Fit to view
      - e2e: orrery-plane::should expand Ring 3 browsers by clicking their compact nodes and return to 10.2
      - e2e: panel::should show the stage-1 webserver headline naming 10.1 only
      - e2e: panel::should render a full-trace journey log with hop 1/4 to 4/4 in ascending order
      - e2e: panel::should open the legend drawer and read the tick = 100 ms mapping and lane labels
      - e2e: panel::should give every trace, camera, and load control a non-empty title
      - e2e: panel::should deep-link ?stage=5&users=30 to stage 5 with 30 browsers
      - e2e: panel::should fall back to stage 1 on unknown ?stage=9 without errors
      - e2e: panel::should show the SERVED card tallying per tick without NaN at tick 0
      - e2e: panel-stage6::should switch to Stage 6, resolve example.com through DNS 10.60, and inspect DNS code + TTL ledger
      - e2e: panel-stage6::should trace example.com/about with DNS ask + answer hops
      - e2e: panel-stage6::should keep GET /about on Stage 6 at the Stage 5 hop story
      - e2e: panel-stage6::should render the NX card on Stage 6 for a missing host without emitting a GET
      - e2e: panel-stage6::should deep-link ?stage=6 into the DNS topology
      - e2e: panel-stage6::should drop the DNS record from the rail console and watch the browser render NX with no GET emitted
      - e2e: panel-stage6::should narrate the NX run exactly like an unknown-host run without inventing a frame
      - e2e: panel-stage6::should verify the stage-6 NX mission only after drop and restored resolve
      - e2e: control-room-rail::should dock teaching, missions, and legend into the right rail with the plane unchanged
      - e2e: control-room-rail::should keep the rail tab state across stage switches
      - e2e: control-room-rail::should collapse the rail under the viewport below the responsive breakpoint
      - e2e: fault-console::should toggle the webserver fault from the rail console and read connection refused in the trace
      - e2e: fault-console::should keep crowd sends refused while down and restore a 200 after toggle-back
      - e2e: fault-console::should verify the stage-1 recovery mission only after refusal and recovery
      - e2e: fault-console::should skip the down backend in the round-robin and keep the crowd served
      - e2e: fault-console::should narrate the skip in the stage-2 trace without aborting the served story
      - e2e: fault-console::should verify the stage-2 failover mission only after skip and rejoin
      - e2e: fault-console::should bypass the cache from the rail console and watch the origin take every GET
      - e2e: fault-console::should narrate the bypass in the stage-3 trace with a fresh HIT after rejoin
      - e2e: fault-console::should verify the stage-3 cold mission only after bypass and rejoin
      - e2e: fault-console-stage4::should down the primary from the rail console and watch writes fail while reads keep serving
      - e2e: fault-console-stage4::should narrate the failed write as a real 503 without ever faking a WRITE frame
      - e2e: fault-console-stage4::should verify the stage-4 write-fail mission only after failed write and restored write
      - e2e: fault-console-stage5::should crash the worker from the rail console and watch async jobs wait, then re-deliver
      - e2e: fault-console-stage5::should narrate the crashed worker without ever faking a commit
      - e2e: fault-console-stage5::should verify the stage-5 re-delivery mission only after crash and restore
    entry_point: index.html -> Diagram Panel link

allowlist:
  - .github/**
  - .githooks/**
  - .gitignore
  - .opencode/**
  - .prettierignore
  - .prettierrc
  - AGENTS.md
  - DESIGN.md
  - FACTORY.md
  - LICENSE
  - README.md
  - docs/**
  - eslint.config.js
  - package-lock.json
  - package.json
  - playwright.config.js
  - scripts/**
  - slices.yaml
  - storymap.yaml
  - vitest.config.js
