# storymap.yaml — stages are activities; stage names mirror the system-design
# primer's scaling ladder (kit plan Phase 2 adds stages 2+).
meta:
  project: stack-orrery
  description: >-
    A runnable orrery of a web stack: simulated components driven by a
    discrete tick queue, making scaling dynamics visible instead of
    described.
  last_updated: 2026-10-15

activities:
  - name: 'Stage 1 — Single server under load'
    tasks:
      - id: SHELL-1
        name: Enter the app
        entry_point: index.html (app root)
        stories:
          - title: See a landing page that links to the diagram panel
            status: done
            priority: high
            tests:
              - e2e: shell::should reach the diagram panel from the landing page

      - id: SIM-1
        name: Advance the simulation deterministically
        entry_point: n/a (engine behavior, not navigable)
        stories:
          - title: Replay a fixed seed into the identical tick sequence
            status: done
            priority: high
            tests:
              - unit: test/sim/engine.test.js::same seed replays the identical tick sequence
          - title: Watch queue depth climb when arrival rate exceeds service rate
            status: done
            priority: high
            tests:
              - unit: test/sim/webserver.test.js::queue depth climbs when arrival rate exceeds service rate
          - title: Send a browser's slim GET across the mini-IP network and read the route back
            status: done
            priority: high
            tests:
              - unit: test/sim/network.test.js::browser sends slim GET over network mini-IP and parses 200 and 404 responses
              - unit: test/sim/webserver.test.js::handleRequest routes slim GET paths to 200 or 404 and rejects non-GET with 405

      - id: PANEL-1
        name: Watch a simulated web server under load
        entry_point: index.html -> Diagram Panel link
        stories:
          - title: See N simulated users sending requests at the server
            status: done
            priority: high
            tests:
              - e2e: panel::should show queue depth climbing as simulated users increase
          - title: Read queue depth and latency as UI state while it runs
            status: done
            priority: medium
            tests:
              - unit: test/panel/model.test.js::snapshot exposes queue depth and latency as UI state
          - title: Step one tick and see the server's mini-IP with the latest exchange on the wire
            status: done
            priority: medium
            tests:
              - unit: test/panel/model.test.js::formats the latest HTTP exchange across mini-IPs for the inspector
              - e2e: panel::should step a single tick and display the slim HTTP exchange over mini-IP 10.1
