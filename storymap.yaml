# storymap.yaml — stages are activities; stage names mirror the system-design
# primer's scaling ladder (kit plan Phase 2 adds stages 2+).
meta:
  project: stack-orrery
  description: >-
    A runnable orrery of a web stack: simulated components driven by a
    discrete tick queue, making scaling dynamics visible instead of
    described.
  last_updated: 2026-10-24

activities:
  - name: 'Stage 1 — Single server under load'
    tasks:
      - id: SHELL-1
        name: Enter the app
        entry_point: index.html (app root)
        stories:
          - title: See a hero landing page with the scaling ladder overview that links to the diagram panel
            status: done
            priority: high
            tests:
              - e2e: shell::should reach the diagram panel from the landing page

      - id: SIM-1
        name: Advance the simulation deterministically
        entry_point: n/a (engine behavior, not navigable)
        stories:
          - title: Replay a fixed seed into the identical tick sequence
            status: done
            priority: high
            tests:
              - unit: test/sim/engine.test.js::same seed replays the identical tick sequence
          - title: Watch queue depth climb when arrival rate exceeds service rate
            status: done
            priority: high
            tests:
              - unit: test/sim/webserver.test.js::queue depth climbs when arrival rate exceeds service rate
          - title: Send a browser's slim GET across the mini-IP network and read the route back
            status: done
            priority: high
            tests:
              - unit: test/sim/network.test.js::browser sends slim GET over network mini-IP and parses 200 and 404 responses
              - unit: test/sim/webserver.test.js::handleRequest routes slim GET paths to 200 or 404 and rejects non-GET with 405

      - id: PANEL-1
        name: Watch a simulated web server under load
        entry_point: index.html -> Diagram Panel link
        stories:
          - title: See N simulated users sending requests at the server
            status: done
            priority: high
            tests:
              - e2e: panel::should show queue depth climbing as simulated users increase
          - title: Read queue depth and latency as UI state while it runs
            status: done
            priority: medium
            tests:
              - unit: test/panel/model.test.js::snapshot exposes queue depth and latency as UI state
          - title: Step one tick and see the server's mini-IP with the latest exchange on the wire
            status: done
            priority: medium
            tests:
              - unit: test/panel/model.test.js::formats the latest HTTP exchange across mini-IPs for the inspector
              - e2e: panel::should step a single tick and display the slim HTTP exchange over mini-IP 10.1
          - title: Trace a custom URL hop-by-hop into the browser viewport and inspect component code
            status: done
            priority: high
            tests:
              - unit: test/panel/model.test.js::describes hop-by-hop trace labels and component inspector state
              - unit: test/panel/model.test.js::maps a live snapshot to the webserver inspector state as JSON
              - e2e: panel::should trace a custom URL hop-by-hop into the browser viewport and inspect component code
          - title: Click any component node to open its code and live internal state in the inspector
            status: done
            priority: medium
            tests:
              - e2e: panel::should trace a custom URL hop-by-hop into the browser viewport and inspect component code
          - title: Pan and zoom the concentric orrery plane and reset the camera with Fit to view
            status: done
            priority: high
            tests:
              - unit: test/panel/camera.test.js::pans world coordinates inversely to zoom and clamps to world bounds
              - unit: test/panel/camera.test.js::zooms toward the cursor while keeping the cursor world point fixed
              - unit: test/panel/camera.test.js::computes concentric ring coordinates and stage bounding boxes for the orrery
              - unit: test/panel/camera.test.js::maps every simulated browser to an addressable Ring 3 slot around the expanded one
              - e2e: orrery-plane::should pan and zoom the concentric orrery plane and reset with Fit to view
          - title: Click any browser on Ring 3 to expand it into the full browser card
            status: done
            priority: high
            tests:
              - e2e: orrery-plane::should expand Ring 3 browsers by clicking their compact nodes and return to 10.2
          - title: Show the snapshot-derived inspector headline so the named addresses match the live state
            status: done
            priority: medium
            tests:
              - unit: test/panel/model.test.js::stage 1 webserver headline derives mini-IP 10.1 from the live snapshot, not from the static 10.11 / 10.12 entry
              - unit: test/panel/model.test.js::stages 2-5 webserver headline derives the snapshot backends as mini-IP 10.11 / 10.12
              - e2e: panel::should show the stage-1 webserver headline naming 10.1 only
          - title: Read the hop narrative in run order — hops ascending inside a run, a newer run floating above an older one
            status: done
            priority: medium
            tests:
              - unit: test/panel/render.test.js::within one run, hop entries order ascending regardless of emission order
              - unit: test/panel/render.test.js::a newer run floats above an older one; entries stay whole per run
              - e2e: panel::should render a full-trace journey log with hop 1/4 to 4/4 in ascending order
          - title: Read a legend drawer naming the tick clock, the cache stats trio, the Ring 3 site chips, and the wire-lane labels
            status: done
            priority: medium
            tests:
              - e2e: panel::should open the legend drawer and read the tick = 100 ms mapping and lane labels
              - e2e: panel::should give every trace, camera, and load control a non-empty title

  - name: 'Stage 2 — Load balancer and duplicated servers'
    tasks:
      - id: SIM-2
        name: Balance traffic round-robin across duplicated servers
        entry_point: n/a (engine behavior, not navigable)
        stories:
          - title: Distribute requests round-robin across backend mini-IPs 10.11 and 10.12
            status: done
            priority: high
            tests:
              - unit: test/sim/loadbalancer.test.js::distributes requests strictly round-robin across backend mini-IPs
              - unit: test/sim/loadbalancer.test.js::stage 2 engine splits load across 10.11 and 10.12 and doubles service capacity

      - id: PANEL-2
        name: Switch to Stage 2 and trace through the load balancer
        entry_point: index.html -> Diagram Panel link -> 2 · LB / Dup Servers pill
        stories:
          - title: Switch to Stage 2, trace requests across 10.11 and 10.12, and inspect LoadBalancer code and state
            status: done
            priority: high
            tests:
              - unit: test/panel/model.test.js::describes Stage 2 5-hop load-balancer trace labels and loadbalancer inspector state
              - e2e: panel::should switch to Stage 2, alternate requests across 10.11 and 10.12 via the load balancer, and inspect its code

  - name: 'Stage 3 — Cache (TTL, cache-aside)'
    tasks:
      - id: SIM-3
        name: Serve cache-aside GETs with tick-based TTL behind the load balancer
        entry_point: n/a (engine behavior, not navigable)
        stories:
          - title: Serve cache hits before TTL expiry, evict expired entries, and double warm capacity
            status: done
            priority: high
            tests:
              - unit: test/sim/cache.test.js::serves cache hits before TTL expiry and evicts entries once ttlTicks elapse
              - unit: test/sim/cache.test.js::stage 3 engine shares cache-aside entries across 10.11 and 10.12

      - id: PANEL-3
        name: Switch to Stage 3 and trace through the shared cache
        entry_point: index.html -> Diagram Panel link -> 3 · Cache pill
        stories:
          - title: Switch to Stage 3, warm Cache 10.20 on a miss, serve a shared hit across backends, and inspect Cache code and TTL state
            status: done
            priority: high
            tests:
              - unit: test/panel/model-stage34.test.js::describes Stage 3 6-hop cache-aside trace labels and cache inspector state
              - e2e: panel::should switch to Stage 3, warm Cache 10.20 on a miss from 10.11, serve a hit from 10.12, and inspect cache code

  - name: 'Stage 4 — Database primary/replica with replication lag'
    tasks:
      - id: SIM-4
        name: Write through Primary 10.30 and read stale or fresh from Replica 10.31
        entry_point: n/a (engine behavior, not navigable)
        stories:
          - title: Replicate primary writes to the read replica after replicationLagTicks and track stale reads
            status: done
            priority: high
            tests:
              - unit: test/sim/database.test.js::replicates primary writes to the read replica after replicationLagTicks and tracks stale reads
          - title: On POST write to Primary 10.30 and invalidate the cached path; on GET miss read Replica 10.31 fresh or stale and catch up
            status: done
            priority: high
            tests:
              - unit: test/sim/database.test.js::stage 4 engine writes to Primary 10.30, invalidates Cache 10.20, serves stale replica reads during lag, and catches up

      - id: PANEL-4
        name: Switch to Stage 4 and trace through the primary/replica database
        entry_point: index.html -> Diagram Panel link -> 4 · DB + Replication pill
        stories:
          - title: Switch to Stage 4, write to Primary 10.30 on POST, observe replica lag on GET, and inspect Database code and row versions
            status: done
            priority: high
            tests:
              - unit: test/panel/model-stage34.test.js::describes Stage 4 7-hop database trace labels and database inspector state
              - e2e: panel::should switch to Stage 4, write to Primary 10.30 on POST, observe replica lag on GET, and inspect database code

  - name: 'Stage 5 — Worker Queue & Async Background Processing'
    tasks:
      - id: SIM-5
        name: Enqueue asynchronous jobs and execute via worker 10.41
        entry_point: n/a (engine behavior, not navigable)
        stories:
          - title: Enqueue background jobs, step FIFO execution across job duration ticks, and write results to database
            status: done
            priority: high
            tests:
              - unit: test/sim/queue.test.js::worker queue sim component

      - id: PANEL-5
        name: Switch to Stage 5 and trace asynchronous job requests
        entry_point: index.html -> Diagram Panel link -> 5 · Worker Queue pill
        stories:
          - title: Switch to Stage 5, send asynchronous requests, trace hop-by-hop into worker queue, and inspect worker state
            status: done
            priority: high
            tests:
              - unit: test/panel/model-stage5.test.js::describes Stage 5 8-hop async queue trace labels and workerqueue inspector state
              - e2e: panel::should switch to Stage 5, process an async POST /jobs job through worker 10.41, and inspect queue state
