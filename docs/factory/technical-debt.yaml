# technical-debt.yaml — schema (factory-kit DEBT-REGISTER.md,
# https://github.com/awingrove/factory-kit/blob/main/DEBT-REGISTER.md).
# Validated by scripts/guard-debt.mjs (run via `npm run guard`).
#
#   open     required: id, title, where, what, interest, paydown
#            forbidden: closed, note
#            optional: deferred, deferral_note
#   closed   required: id, title, closed (a real ISO date), note
#            optional: where (historical path — never existence-checked),
#                      what, interest
#   defects  required: id, title, found (a real ISO date), injection_stage,
#                      detection_stage, systemic_gap
#            optional: what, closed_in
#
#   ids TD-\d+ / DL-\d+, unique across the whole register. Every prose field
#   is a folded block scalar (>-), never plain: prose contains ": ".
#   Dates are bare ISO scalars. Bootstrap note (kit): warn-only until three
#   entries, then the gate is hard.

open: []

closed: []

defects:
  - id: DL-1
    title: >-
      Compact Ring-3 browser nodes stayed stationary when the ring-gap slider scaled
    found: 2026-10-19
    injection_stage: >-
      Step 5 of docs/plans/2026-10-18-orrery-plane-camera.md (commit 9900ac1)
    detection_stage: >-
      Human interactive exploratory check on panel.html
    what: >-
      Dragging #ring-gap-slider scaled the SVG rings, spokes, and .node-card
      elements via viewport.js positionParts(), but .browser-compact buttons
      were only positioned inside render.js renderRingBrowsers() and
      syncLayout() omitted ringGapSlider.value.
    systemic_gap: >-
      World-space coordinate writes were split between viewport.js
      (positionParts) and render.js (renderRingBrowsers), and the e2e test for
      ring-gap scaling only asserted the SVG circle r attribute rather than the
      positioned DOM nodes on that ring.
    closed_in: >-
      8ab0e21 — viewport.js positionParts() repositions .browser-compact slots
      alongside .node-card elements, syncLayout() preserves ringGapSlider.value,
      and e2e/panel.spec.js asserts browser-node-10.3 style.left updates on
      ring-gap change.
  - id: DL-2
    title: >-
      Lead session began executing Stage 4 Step 2 inline instead of dispatching a sub-agent on the project's configured executor model
    found: 2026-10-20
    injection_stage: >-
      Phase 1 bootstrap of AGENTS.md and FACTORY.md (commit 9884fd5)
    detection_stage: >-
      Human intervention during Stage 4 execution
    what: >-
      After committing Step 1 of docs/plans/2026-10-20-stage4-database.md, the
      lead session started implementing Step 2 directly in the lead context
      instead of spawning a fresh sub-agent on opencode-go/glm-5.3-flash.
    systemic_gap: >-
      Neither factory-kit nor this repo's AGENTS.md and FACTORY.md codified the
      lead-to-subagent cold brief execution rule, the project's configured
      lead/executor models, or the requirement that every unprompted human
      intervention be logged in the defect register.
    closed_in: >-
      5741b20 & awingrove/factory-kit#2 — AGENTS.md and FACTORY.md codify
      lead-to-subagent cold execution on opencode-go/glm-5.3-flash and
      human-intervention defect logging; factory-kit#2 adds project model
      selection and intervention capture to the kit contract.
  - id: DL-3
    title: >-
      Stage 5 shipped without its brief-mandated Stage 5 e2e and hop-label tests, so the
      panel's ring topology never updated when switching to the Worker Queue stage
    found: 2026-10-21
    injection_stage: >-
      Step 2 executor cold-implementation of docs/plans/2026-10-21-stage5-worker-queue.md
      (commit b12ba6b)
    detection_stage: >-
      Human interactive exploratory check on panel.html — the executor's own
      verify run was green
    what: >-
      computeStageLayout(5) threw at makeWire: the cache-aside node block
      guarded `stage === 3 || stage === 4` while the Stage 5 block wired
      cache -> queue -> worker -> db, so stage-pill-5's switchStage() died
      before renderStageTopology/viewport.syncLayout() and the orrery kept
      the previous stage's ring count. queue-stats, worker-stats, db-stats,
      and db-rows-list also stayed at their HTML defaults, and panel.js's
      TOTAL_HOPS lacked the 5: 8 key.
    systemic_gap: >-
      The brief's section-4 contract (model.test.js 8-hop labels, e2e switch
      to Stage 5) was never written, yet Step 2 closed green — and the
      storymap marked PANEL-5 done with a test reference to a stale
      Stage-1-era label test that never checked Stage 5. Story refs were
      resolvable without pinning the story's own behavior, and nothing
      checked brief-contract test existence at Step-3 review; a suite with
      no Stage 5 pinning could not detect the escape.
    closed_in: >-
      The Stage 5 ring-regression fix in this change: layout.js cache node
      creation opens to stage >= 3, panel.js TOTAL_HOPS gains 5: 8,
      render.js writes queue/worker stats and the stage >= 3 / stage >= 4
      cache/db cards from live snapshots, model.test.js gains Stage 5
      labels (extracted to test/panel/model-stage5.test.js for
      guard-file-size), and e2e/panel.spec.js pins the Stage 5 switch
      (7 rings, 202 Accepted, worker commit, inspector state).
  - id: DL-4
    title: >-
      The Stage 5 trace machine hardcoded the async-job narrative for every request, so GET traces
      rendered 202 Accepted and enqueued-job frames although the queue saw nothing
    found: 2026-10-22
    injection_stage: >-
      Step 2 executor cold-implementation of docs/plans/2026-10-21-stage5-worker-queue.md
      (commit b12ba6b)
    detection_stage: >-
      Human screenshot review of panel.html at Hop 5/8 — control strip read
      "202 Accepted" while the journey log read "GET /about => 200"
    what: >-
      trace.js Stage 5 hops emitted the enqueue/202/worker-commit frames
      regardless of the request, and model.js's hop sentences hardcoded
      "202 Accepted"; a GET /about was narrated as an enqueued async job that
      the WorkerQueue had not received, contradicting the actual served
      200 response recorded on the sim itself.
    systemic_gap: >-
      The trace narrative was authored independently of the served record:
      only the POST /jobs path had pinning tests, and no pin checked that UI
      hop text and sim frames describe the same exchange — a violation of
      the executable conceptual model that showed up in every Stage 5 trace
      except the single method the brief pinned.
    closed_in: >-
      The Stage 5 trace-truth fix in this change: trace.js branches the
      Stage 5 hops on the actual served record (async enqueue / Stage 4
      cache/db narrative / idle worker tail), model.js sentences read the
      trace fields they describe, render-stage.js hop highlighting follows
      the same branch, and unit + e2e pins cover both the async POST /jobs
      and a plain GET with the worker idle.
  - id: DL-5
    title: >-
      Camera drawers sat inside the camera viewport, so wheel/drag over the teaching or legend
      drawer was intercepted as camera zoom/pan and the drawer could not scroll itself
    found: 2026-10-26
    injection_stage: >-
      The teaching-drawer slice's overlay-in-viewport layout (teaching panel
      positioned inside #orrery-viewport, css/panel/teaching.css)
    detection_stage: >-
      Human exploratory check on panel.html — wheel over the open Teach box
      zoomed the orrery plane instead of scrolling the drawer
    what: >-
      viewport.js bound the wheel-zoom and drag-pan handlers on #orrery-viewport
      itself; .teaching-panel and .legend-panel are children of that viewport, so
      their events bubbled into the camera handlers whose
      e.preventDefault() turned drawer-scroll intent into camera zoom.
    systemic_gap: >-
      Overlays mounted inside the camera viewport inherit its input handlers;
      input ownership was defined by DOM tree position, not by intent surface.
      The fence (this change, .camera-drawer) restores intent locally; the
      structural paydown — no scroller inside the camera viewport at all — is
      the two-zone control-room remodel, docs/plans/2026-10-26-style2-control-room-remodel.md.
    closed_in: >-
      The camera-drawer fence in this change: wheel handler returns before
      preventDefault when the target is inside .camera-drawer, pointerdown
      ignores drags starting there, both drawers gain the class plus
      overscroll-behavior: contain, and e2e/camera-drawer.spec.js pins
      drawer-scroll-without-zoom, drag-touches-nothing, and the control pin
      that the plane's own wheel still zooms.
